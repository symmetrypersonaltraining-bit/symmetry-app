<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Chat Message</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #EDEDED; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #1E1E22; padding: 16px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 17px; margin: 0; font-weight: 800; }
  button { font-size: 15px; font-weight: 800; padding: 11px 18px; border-radius: 12px; border: none; color: #fff; background: #E53935; cursor: pointer; box-shadow: 0 4px 14px rgba(229,57,53,0.35); transition: background .15s; flex: 0 0 auto; }
  button:active { transform: translateY(1px); }
  button.copied { background: #16A34A; box-shadow: 0 4px 14px rgba(22,163,74,0.35); }
  textarea { width: 100%; min-height: 620px; border: 1px solid #d5d5db; border-radius: 14px; padding: 16px; font-size: 15px; line-height: 1.5; background: #fff; color: #1E1E22; resize: vertical; font-family: inherit; white-space: pre-wrap; }
  .hint { font-size: 12.5px; color: #6B7280; margin: 8px 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>📋 Group Chat Message</h1>
    <button id="copyBtn" onclick="copyMsg()">Copy</button>
  </div>
  <textarea id="msg" readonly></textarea>
  <div class="hint">Tap Copy, then paste into the group chat. (Or tap in the box, select all, and copy.)</div>
</div>
<script>
  var MSG = [
    "🔥 BIG APP UPDATES + OUR CHALLENGE — everybody read this 🔥",
    "",
    "Team, the app just leveled up. Here's what's new:",
    "",
    "🧠 Coach's Read (home screen) — a daily personal read from me on your training: streak, consistency, weigh-ins, and where you're trending. Once a week it asks you a quick question — answer it and it lands in my inbox so I can adjust for you.",
    "",
    "🥗 Smarter nutrition coach — it now knows your actual plan and your real numbers. Ask it stuff like \"what should I eat to lean out this week?\" and it guides you off YOUR data.",
    "",
    "⚖️ Sunday Weigh-In reminder — every Sunday the app pops a reminder with a one-tap button to the weight logger. Weekly weigh-ins are how we know it's working — don't skip them.",
    "",
    "📸 Progress Photos (Progress tab) — optional but powerful. Dated pics with a built-in pose guide, compare any two dates side by side, and share a Before/After if you want. No pressure to post — mainly for YOU to see your change.",
    "",
    "🏆 THE \"LOCK IN\" CHALLENGE — how to join:",
    "1. Reply \"IN 🙌\" right here. That puts you on the board.",
    "2. Log today — meals in the Nutrition tab, workout in the Workout tab. Daily logging is the whole game.",
    "3. Weigh in this Sunday — tap \"Log my weigh-in\" when the reminder pops, first thing in the morning.",
    "4. (Optional) Snap your Day 1 photos — Progress tab → Progress Photos → \"How to shoot\" → front, sides, back.",
    "",
    "Then keep it rolling daily:",
    "- Log meals + workout every day.",
    "- Post ONE win here daily — a session done, a meal on point, a PR, or just showing up on a hard day.",
    "- Ask questions in here — that's what it's for.",
    "",
    "What this chat is for: this is our community — accountability, wins, questions, and hype. The people who talk in here are the people who get results. Show up daily, even if it's one line.",
    "",
    "Reply IN and let's build something we're all proud of 👇",
    "(First names only in here — we're a team.)"
  ].join("\n");

  document.getElementById("msg").value = MSG;

  function copyMsg() {
    var btn = document.getElementById("copyBtn");
    var done = function () { btn.textContent = "Copied ✓"; btn.classList.add("copied"); setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 2200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(MSG).then(done, function () { fallback(done); });
    } else { fallback(done); }
  }
  function fallback(done) {
    var t = document.getElementById("msg");
    t.focus(); t.select();
    try { document.execCommand("copy"); done(); } catch (e) { alert("Select the text and copy manually."); }
  }
</script>
</body>
</html>
